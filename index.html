<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1117">
  <meta name="description" content="Four factions. One shared board. Infinite futures. A local simultaneous chess game across space, time, and branching universes.">
  <title>Four-Player Multiverse Chess</title>
  <link rel="icon" href="/chess/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/chess/styles.css">
  <script type="module" src="/chess/game.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="identity">
      <img src="/chess/emblem.svg" width="42" height="42" alt="">
      <div><p class="eyebrow">FOUR-PLAYER</p><h1>Multiverse Chess</h1></div>
    </div>
    <div class="factions" id="factions" aria-label="Factions"></div>
    <div class="header-actions">
      <a id="account-link" class="button subtle" href="/chess/login.html">Log in</a>
      <div class="top-history" aria-label="Round history">
        <button class="button square" id="previous" aria-label="Previous round">‹</button>
        <span id="history-label">Opening position</span>
        <button class="button square" id="next" aria-label="Next round">›</button>
        <span class="live-label" id="live-label">● LIVE</span>
        <button class="text-button" id="replay">▶ Play round</button>
        <button class="text-button" id="live">Return to live</button>
      </div>
      <button id="help" class="button subtle">How to play</button>
      <button id="export" class="button subtle">Export</button>
      <button id="import" class="button subtle">Import</button>
      <button id="new" class="button subtle">New match</button>
    </div>
  </header>
  <main class="workspace">
    <section class="theater" aria-labelledby="scene-title">
      <div class="scene-heading">
        <div class="scene-name"><span class="orb"></span><h2 id="scene-title">Multiverse</h2></div>
        <div class="metrics" id="metrics"></div>
      </div>
      <div class="viewport" id="viewport">
        <canvas id="scene" tabindex="0" aria-label="Multiverse boards. Use WASD or arrow keys to pan, Alt plus arrows to move the square cursor, Enter to select, and plus or minus to zoom."></canvas>
        <div class="map-caption" id="map-caption"></div>
        <div class="camera" role="group" aria-label="Camera controls">
          <button data-camera="minus" aria-label="Zoom out" title="Zoom out">−</button>
          <span id="scale">100%</span>
          <button data-camera="plus" aria-label="Zoom in" title="Zoom in">+</button>
          <i></i>
          <button data-camera="fit" aria-label="Fit multiverse" title="Fit multiverse (F)">
            <svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4m0 8v4h-4m-8 0H4v-4"/></svg>
          </button>
          <button data-camera="focus" aria-label="Focus selection" title="Focus selection or inspected board (Z)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg>
          </button>
          <button data-camera="player" aria-label="Focus player" title="Focus current player">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a7 7 0 0 1 14 0v2M3 3h3M3 3v3m18-3h-3m3 0v3"/></svg>
          </button>
          <button data-camera="reset" aria-label="Reset view" title="Reset view (0)">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2 5m-2-5V6m0 6h6"/></svg>
          </button>
        </div>
        <div class="overlays" role="group" aria-label="Map overlays">
          <button type="button" data-overlay="axes" aria-label="Time axis" title="Time axis" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 18h18M7 5v13m5-9v9m5-13v13M4 18l3-3 3 3"/></svg></button>
          <button type="button" data-overlay="links" aria-label="Timeline links" title="Timeline links" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6 8l5 8m7-8-5 8"/></svg></button>
          <button type="button" data-overlay="rifts" aria-label="Temporal Rifts" title="Temporal Rifts" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 12c4-9 8 9 12 0s5 0 6 0" stroke-dasharray="3 2"/><path d="M4 5l2 2m12 10 2 2"/></svg></button>
          <button type="button" data-overlay="labels" aria-label="Board labels" title="Board labels" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 10h10M7 14h6"/></svg></button>
          <button type="button" data-overlay="paths" aria-label="Move paths" title="Move paths" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><path d="M7 17C10 3 14 19 20 5m-5 0h5v5"/></svg></button>
        </div>
        <div class="scene-hint">DRAG TO PAN <b>·</b> SCROLL OR PINCH TO ZOOM</div>
      </div>
      <div class="legend" aria-label="Map legend">
        <span><i class="lg normal"></i> Legal move</span>
        <span><i class="lg capture"></i> Capture</span>
        <span><i class="lg branch"></i> Branch</span>
        <span><i class="lg rift"></i> Temporal Rift</span>
        <span class="legend-optional"><i class="lg optional"></i> Optional frontier</span>
      </div>
    </section>
    <aside class="sidebar" id="sidebar" aria-label="Round controls">
      <section class="panel round-panel">
        <div class="drag-handle" id="panel-handle" title="Drag to move controls">⠿ &nbsp; Move controls</div>
        <div class="panel-kicker"><span>ROUND <b id="round-number">01</b></span><span id="phase" class="phase">PLANNING</span></div>
        <div id="turn"></div>
        <div id="planning"></div>
        <div id="activity" aria-live="polite"></div>
      </section>
      <div class="save-status" id="save-status" role="status"></div>
    </aside>
  </main>
  <dialog id="dialog"><div id="dialog-inner"></div></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
</body>
</html>
