<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in · 5D Chess</title>
  <link rel="icon" href="/chess/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/chess/styles.css"><link rel="stylesheet" href="/chess/portal.css"><link rel="stylesheet" href="/chess/shell.css">
  <script type="module" src="/chess/portal.js"></script>
</head><body data-page="login">
<header class="masthead app-topbar"><a class="brand" id="brand-home" href="/chess/"><img src="/chess/logo.png" width="48" height="48" alt=""><span><b>5D</b> Chess</span></a><div id="account-area" class="account-area"><a id="account-link" class="button subtle" href="/chess/">Local play</a></div></header>
  <main class="portal"><section class="portal-card auth-card">
    <p class="eyebrow">ONLINE MULTIVERSE</p><h2 id="auth-title">Log in</h2>
    <p class="portal-intro" id="auth-intro">Log in to join friends and continue your games.</p>
    <form method="post" id="auth-form">
      <label>Username<input spellcheck="false" autocapitalize="none" id="username" name="username" autocomplete="username" required maxlength="32"></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <label id="confirm-row" hidden>Re-enter password<input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="256"></label>
      <p id="auth-error" class="form-error" role="alert" hidden></p>
      <button id="auth-submit" class="button primary block" type="submit">Log in</button>
    </form>
    <div id="missing-account" hidden><p>Account not found.</p><button id="make-account" class="button">Make account</button> <button id="return-login" class="text-button">Return</button></div>
    <div class="auth-footer"><button id="switch-mode" class="text-button" type="button">Create an account</button></div>
  </section></main>
</body></html>
