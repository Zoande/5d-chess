<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game lobby · Multiverse Chess</title>
  <link rel="icon" href="/chess/emblem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/chess/styles.css"><link rel="stylesheet" href="/chess/portal.css">
  <script type="module" src="/chess/portal.js"></script>
</head><body data-page="lobby">
  <header class="masthead"><a class="identity" href="/chess/lobby.html"><img src="/chess/emblem.svg" width="42" height="42" alt=""><div><p class="eyebrow">FOUR-PLAYER</p><h1>Multiverse Chess</h1></div></a><div class="header-actions"><span id="account-name"></span><button id="logout" class="button subtle">Log out</button></div></header>
  <main class="portal lobby"><p class="eyebrow">ONLINE MULTIVERSE</p><h2>Choose a game</h2><p class="portal-intro">Play at your own pace. Turns wait for every remaining player; there is no timer.</p>
    <div class="lobby-actions"><a class="button primary" href="/chess/?local=1">Local play</a><button class="button" data-view="make">Make game</button><button class="button" data-view="join">Join game</button><button class="button" data-view="continue">Continue game</button></div>
    <section id="make" class="portal-card lobby-view" hidden><h3>Make game</h3><form id="make-form"><label>Game name<input id="game-title" maxlength="60" placeholder="My game"></label><label>Game password <small>Optional · password games are hidden from the public list</small><input id="game-password" type="password" maxlength="256" autocomplete="new-password"></label><button class="button primary" type="submit">Create game</button></form><p id="make-error" class="form-error" role="alert" hidden></p></section>
    <section id="join" class="portal-card lobby-view" hidden><h3>Join game</h3><form id="join-form"><label>Four-letter code<input id="join-code" maxlength="4" pattern="[A-Za-z]{4}" autocomplete="off" required></label><label>Password <small>Only for a private game</small><input id="join-password" type="password" autocomplete="off"></label><button class="button primary" type="submit">Join</button></form><p id="join-error" class="form-error" role="alert" hidden></p><h4>Open games</h4><div id="available-games" class="game-list"></div></section>
    <section id="continue" class="portal-card lobby-view" hidden><h3>Your games</h3><div id="my-games" class="game-list"></div></section>
  </main>
</body></html>
